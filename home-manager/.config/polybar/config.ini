[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
bottom = true
background = #363537
foreground = #fbfef9
font-0 = monospace:size=11;2
padding = 1
module-margin = 1
separator = |
separator-foreground = #808080
modules-left = i3
modules-right = wlan eth vpn cpu memory battery disk date tray

[bar/secondary]
inherit = bar/main
modules-right = wlan eth vpn cpu memory battery disk date

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
label-separator = " "
label-focused = %name%
label-focused-background = #1793d0
label-focused-foreground = #f1f1f1
label-focused-padding = 0
label-unfocused = %name%
label-unfocused-foreground = #1793d0
label-unfocused-padding = 0
label-visible = %name%
label-visible-foreground = #797979
label-visible-padding = 0
label-urgent = %name%
label-urgent-background = #ea4c59
label-urgent-padding = 0

[module/wlan]
type = internal/network
interface-type = wireless
label-connected = WiFi %essid% ↓%downspeed% ↑%upspeed%
format-disconnected =

[module/eth]
type = internal/network
; shortcut: built-in Ethernet only; add a dock interface if docked wired status matters.
interface = enp195s0f0
label-connected = Ethernet ↓%downspeed% ↑%upspeed%
format-disconnected =

[module/vpn]
type = custom/script
exec = $HOME/.config/polybar/vpn.sh
interval = 10

[module/cpu]
type = custom/script
exec = $HOME/.config/polybar/cpu.sh
interval = 5

[module/memory]
type = internal/memory
label = RAM %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
label-charging = BAT %percentage%% +
label-discharging = BAT %percentage%%
label-full = BAT 100%

[module/disk]
type = internal/fs
mount-0 = /
format-mounted = %{A1:ghostty -e ncdu -x /:}<label-mounted>%{A}
label-mounted = Disk %free% free

[module/date]
type = internal/date
format = %{A1:$HOME/.config/polybar/calendar.sh:}<label>%{A}
interval = 5
date = %a %d %b %H:%M%
label = %date%

[module/tray]
type = internal/tray
tray-spacing = 4px
